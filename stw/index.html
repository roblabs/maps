<!DOCTYPE html>
<!-- index.html

     The embed page: <iframe src="index.html?src=https://example.com/map.geojson"></iframe>
     Query: src (GeoJSON URL), token (token URL, default tokens/token.txt). -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share the World map</title>
    <link rel="stylesheet" href="stw.css">
</head>
<body>
    <div id="map" role="img" aria-label="Map of the GeoJSON"></div>
    <p id="error" hidden></p>
    <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js" crossorigin async></script>
    <script src="stw-style.js"></script>
    <script src="stw-geojson.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const src = params.get("src") || "fixtures/nps-road-alerts.YOSE.geojson";
        const token = params.get("token") || "tokens/token.txt";
        function start() {
            STWGeoJSON.show(document.getElementById("map"), src, token).catch(function (error) {
                const message = document.getElementById("error");
                message.textContent = "Could not show " + src + ": " + error.message;
                message.hidden = false;
            });
        }
        // Development only: `just serve` writes debug/DEBUG-token.js (the token's claims, no token). A site that does not ship it gets a quiet 404.
        const debug = document.createElement("script");
        debug.src = "debug/DEBUG-token.js";
        debug.onload = function () { console.info("STW token (like jwt.io):", window.STW_TOKEN_DEBUG); };
        document.head.appendChild(debug);
        if (window.mapkit) start(); else document.querySelector("script[src*=mapkit]").addEventListener("load", start);
    </script>
</body>
</html>
